<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>NutriBot</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#f9fafb;color:#111;padding:2rem 1rem}.box{max-width:520px;margin:0 auto}h1{text-align:center;font-size:26px;font-weight:700;margin-bottom:4px}.sub{text-align:center;color:#6b7280;font-size:14px;margin-bottom:8px}.badge{display:block;text-align:center;font-size:12px;font-weight:600;color:#16a34a;margin-bottom:1.5rem}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.5rem;margin-bottom:1rem}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #e5e7eb;cursor:pointer;background:#fff;color:#6b7280}.chip:hover{background:#dcfce7;color:#16a34a}textarea{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:12px;font-size:14px;resize:none;min-height:90px;outline:none}textarea:focus{border-color:#16a34a}button{width:100%;padding:13px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}button:disabled{background:#9ca3af}.hidden{display:none}.cal{background:#dcfce7;border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}.cal-num{font-size:32px;font-weight:700;color:#16a34a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}.macro{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.mv{font-size:20px;font-weight:700}.ml{font-size:12px;color:#6b7280}.brow{display:flex;align-items:center;gap:10px;margin-bottom:6px}.bbg{flex:1;height:8px;background:#e5e7eb;border-radius:4px}.bfill{height:8px;border-radius:4px}.sreason{font-size:12px;color:#6b7280;margin-bottom:1rem}.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;font-size:13px;color:#92400e}.err{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:12px;font-size:13px;color:#dc2626;margin-top:12px}</style></head><body><div class="box"><h1>🥗 NutriBot</h1><p class="sub">Describe your meal in English or Malayalam</p><span class="badge">✅ Free — Powered by Groq AI</span><div class="card"><div class="chips"><span class="chip" onclick="s('Puttu and kadala curry with a banana')">Puttu + Kadala</span><span class="chip" onclick="s('2 chapatis with dal and rice')">Chapati + Dal</span><span class="chip" onclick="s('Masala dosa with chutney and sambar')">Masala Dosa</span><span class="chip" onclick="s('Chicken biryani large plate with raita')">Chicken Biryani</span><span class="chip" onclick="s('ഒരു പ്ലേറ്റ് കേരള സദ്യ, ചോറ്, സാമ്പാർ, അവിയൽ')">Kerala Sadya 🌿</span></div><textarea id="meal" placeholder="e.g. I had puttu and kadala for breakfast..."></textarea><button id="btn" onclick="analyse()">🔍 Analyse Nutrition</button></div><div id="loading" class="hidden" style="text-align:center;padding:1.5rem;color:#6b7280">⏳ Analysing your meal...</div><div id="err" class="hidden err"></div><div id="result" class="hidden card"></div></div><script>function s(t){document.getElementById('meal').value=t}function c(n){return n>=8?'#16a34a':n>=6?'#d97706':n>=4?'#f97316':'#dc2626'}async function analyse(){const meal=document.getElementById('meal').value.trim();if(!meal)return;document.getElementById('btn').disabled=true;document.getElementById('loading').classList.remove('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('err').classList.add('hidden');try{const r=await fetch('/analyse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meal})});const d=await r.json();if(d.error)throw new Error(d.error);const col=c(d.health_score);document.getElementById('result').innerHTML=`<div style="font-size:18px;font-weight:700;margin-bottom:4px">${d.meal_name}</div><div style="font-size:13px;color:#6b7280;margin-bottom:1rem">${d.meal_description}</div><div class="cal"><div><div style="font-size:13px;color:#16a34a;font-weight:500">Total Calories</div><span class="cal-num">${d.calories}</span> <span style="color:#16a34a">kcal</span></div><span style="font-size:36px">🔥</span></div><div class="grid"><div class="macro"><div class="mv">${d.protein_g}g</div><div class="ml">💪 Protein</div></div><div class="macro"><div class="mv">${d.carbs_g}g</div><div class="ml">⚡ Carbs</div></div><div class="macro"><div class="mv">${d.fat_g}g</div><div class="ml">🧈 Fat</div></div><div class="macro"><div class="mv">${d.fiber_g}g</div><div class="ml">🌾 Fiber</div></div></div><div class="brow"><span style="font-size:13px;color:#6b7280;white-space:nowrap">Health Score</span><div class="bbg"><div class="bfill" style="width:${d.health_score*10}%;background:${col}"></div></div><span style="font-weight:700;color:${col}">${d.health_score}/10</span></div><div class="sreason">${d.health_score_reason}</div><div class="tip"><strong>💡 Tip:</strong> ${d.tip}</div>`;document.getElementById('result').classList.remove('hidden')}catch(e){const el=document.getElementById('err');el.textContent='⚠️ '+e.message;el.classList.remove('hidden')}finally{document.getElementById('btn').disabled=false;document.getElementById('loading').classList.add('hidden')}}</script></body></html>
